<!doctype html>
<!-- @dsCard group="UI Kit — Wanted Mobile" name="UI Kit · Wanted Mobile" subtitle="iOS app home — match card, job list, tab bar" viewport="460x900" -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Wanted · Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root" class="stage"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="AppBar.jsx"></script>
<script type="text/babel" src="JobRow.jsx"></script>
<script type="text/babel" src="TabBar.jsx"></script>
<script type="text/babel">
const { useState } = React;

const JOBS = [
  { company: "당근마켓", title: "Senior Product Designer", location: "서울 강남", employment: "정규직", bonus: "1,000,000원", image: "linear-gradient(135deg,#FFD49C,#FF9200)" },
  { company: "토스", title: "Frontend Engineer · React + TypeScript", location: "서울 역삼", employment: "정규직", bonus: "2,000,000원", image: "linear-gradient(135deg,#9EC5FF,#0066FF)" },
  { company: "쿠팡", title: "Backend Engineer · Java", location: "서울 송파", employment: "정규직", bonus: "1,500,000원", image: "linear-gradient(135deg,#7DF5A5,#00BF40)" },
  { company: "라인", title: "Engineering Manager", location: "Tokyo", employment: "정규직", image: "linear-gradient(135deg,#C0B0FF,#6541F2)" },
  { company: "카카오", title: "iOS Engineer · Swift", location: "판교", employment: "정규직", image: "linear-gradient(135deg,#A1E1FF,#00AEFF)" },
  { company: "Wanted Lab", title: "Brand Designer", location: "서울 역삼", employment: "정규직", bonus: "500,000원", image: "linear-gradient(135deg,#AEF779,#58CF04)" },
];

const TABS = ["추천", "AI 매칭", "공고", "프리랜서", "이벤트"];

const Home = () => {
  const [tab, setTab] = useState("home");
  const [topTab, setTopTab] = useState("추천");
  return (
    <IOSDevice color="black">
      <div className="wm-screen">
        <AppBar />
        <div className="wm-searchbar">
          <div className="wm-search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <span>회사 · 포지션 · 기술스택 검색</span>
          </div>
        </div>
        <div className="wm-tabs">
          {TABS.map((t) => (
            <button key={t} className={"wm-tab" + (topTab === t ? " is-active" : "")} onClick={() => setTopTab(t)}>{t}</button>
          ))}
        </div>
        <div className="wm-scroll">
          <div style={{ paddingTop: 16 }}>
            <div className="wm-herocard">
              <div className="wm-herocard__deco"/>
              <div className="wm-herocard__eyebrow">AI Match · 새로 매칭됨</div>
              <h2 className="wm-herocard__title">당신과 맞는 12개의 새 포지션이 있어요</h2>
              <a href="#" onClick={(e)=>e.preventDefault()} className="wm-herocard__cta">
                지금 확인하기
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </a>
            </div>
          </div>
          <div className="wm-section">
            <div className="wm-section__title">추천 포지션</div>
            <div className="wm-section__sub">이력서를 기반으로 매칭됩니다</div>
          </div>
          <div className="wm-joblist">
            {JOBS.map((j, i) => <JobRow key={i} {...j} />)}
          </div>
        </div>
        <TabBar active={tab} onChange={setTab} />
      </div>
    </IOSDevice>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<Home />);
</script>
</body>
</html>
