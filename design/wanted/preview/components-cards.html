<!doctype html>
<!-- @dsCard group="Components" name="Cards" subtitle="Outline, shadow, inverse" viewport="700x230" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#F7F7F8;display:flex;gap:14px;align-items:stretch}
.card{flex:1;background:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.outline{box-shadow:inset 0 0 0 1px var(--color-line-normal)}
.card.shadow{box-shadow:0 4px 6px -1px rgba(23,23,23,.06),0 2px 4px -2px rgba(23,23,23,.06)}
.card.dark{background:var(--color-coolNeutral-10);color:#fff}
.thumb{height:80px;border-radius:10px;background:linear-gradient(135deg,#69A5FF,#0066FF)}
.title{font:700 16px/1.3 var(--font-sans);letter-spacing:-.018em;color:var(--color-label-normal)}
.dark .title{color:#fff}
.meta{font:500 12px var(--font-sans);color:var(--color-label-alternative)}
.dark .meta{color:rgba(255,255,255,.61)}
.cap{position:absolute;top:6px;left:24px;font:600 11px/1 var(--font-sans);color:var(--color-label-alternative);text-transform:uppercase;letter-spacing:.08em}
</style></head><body>
<span class="cap">Cards — outline · shadow · inverse</span>
<div class="card outline">
  <div class="thumb"></div>
  <div class="title">프로덕트 디자이너</div>
  <div class="meta">원티드 · Seoul · Full-time</div>
</div>
<div class="card shadow">
  <div class="thumb" style="background:linear-gradient(135deg,#7DF5A5,#00BF40)"></div>
  <div class="title">Senior PM</div>
  <div class="meta">Wanted Lab · Hybrid</div>
</div>
<div class="card dark">
  <div class="thumb" style="background:linear-gradient(135deg,#9E86FC,#6541F2)"></div>
  <div class="title">Backend Engineer</div>
  <div class="meta">Wanted Gigs · Remote</div>
</div>
</body></html>
