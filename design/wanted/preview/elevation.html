<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="5-tier shadow system" viewport="700x160" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:30px 24px;background:#F7F7F8;display:flex;align-items:center;justify-content:space-around;gap:12px}
.box{width:96px;height:64px;background:#fff;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding:6px;font:500 10px/1 var(--font-mono);color:var(--color-label-alternative)}
.cap{position:absolute;top:8px;left:24px;font:600 11px/1 var(--font-sans);color:var(--color-label-alternative);text-transform:uppercase;letter-spacing:.08em}
</style></head><body>
<span class="cap">Elevation system</span>
<div class="box" style="box-shadow:0 1px 2px -1px rgba(23,23,23,.1)">xsmall</div>
<div class="box" style="box-shadow:0 4px 6px -1px rgba(23,23,23,.06),0 2px 4px -2px rgba(23,23,23,.06)">small</div>
<div class="box" style="box-shadow:0 10px 15px -3px rgba(23,23,23,.07),0 4px 6px -2px rgba(0,0,0,.07)">medium</div>
<div class="box" style="box-shadow:0 16px 24px -6px rgba(23,23,23,.08),0 6px 10px -4px rgba(23,23,23,.08)">large</div>
<div class="box" style="box-shadow:0 24px 38px -10px rgba(23,23,23,.12),0 10px 15px -5px rgba(23,23,23,.1)">xlarge</div>
</body></html>
