<!doctype html>
<!-- @dsCard group="Components" name="Tags & Chips" subtitle="Tags, filter chips, numeric badges" viewport="700x280" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;display:flex;flex-direction:column;gap:14px}
.cap{font:600 11px/1 var(--font-sans);color:var(--color-label-alternative);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:4px;font:600 12px/1 var(--font-sans);letter-spacing:.025em;gap:4px}
.chip{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:9999px;background:var(--color-fill-normal);color:var(--color-label-normal);font:500 13px/1 var(--font-sans);gap:4px}
.chip.active{background:var(--color-coolNeutral-10);color:#fff}
.chip.outline{background:#fff;box-shadow:inset 0 0 0 1px var(--color-line-neutral)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.badge{min-width:18px;height:18px;border-radius:9999px;background:var(--color-red-50);color:#fff;font:600 11px/1 var(--font-sans);display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
</style></head><body>
<div class="cap">Tags & badges</div>
<div class="row">
  <span class="tag" style="background:var(--color-blue-95);color:var(--color-blue-50)">정규직</span>
  <span class="tag" style="background:var(--color-violet-95);color:var(--color-violet-50)">Senior</span>
  <span class="tag" style="background:var(--color-green-95);color:var(--color-green-40)">Active</span>
  <span class="tag" style="background:var(--color-red-94);color:var(--color-red-40)">Urgent</span>
  <span class="tag" style="background:var(--color-fill-normal);color:var(--color-label-normal)"><span class="dot"></span>Remote</span>
  <span class="tag" style="background:var(--color-coolNeutral-10);color:#fff">Premium</span>
</div>
<div class="cap" style="margin-top:4px">Filter chips</div>
<div class="row">
  <span class="chip active">전체</span>
  <span class="chip">Frontend</span>
  <span class="chip">Backend</span>
  <span class="chip">Design</span>
  <span class="chip outline">+ Filter</span>
</div>
<div class="cap" style="margin-top:4px">Numeric / status badges</div>
<div class="row" style="gap:14px">
  <span class="badge">3</span>
  <span class="badge" style="background:var(--color-blue-50)">12</span>
  <span class="badge" style="background:var(--color-green-50)">●</span>
  <span class="badge" style="background:var(--color-coolNeutral-87);color:var(--color-label-normal)">99+</span>
</div>
</body></html>
