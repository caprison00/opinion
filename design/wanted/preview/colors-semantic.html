<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Semantic tokens" subtitle="Label opacity scale, primary, bg, line" viewport="700x230" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.cap{grid-column:1/-1;font:600 11px/1 var(--font-sans);color:var(--color-label-alternative);text-transform:uppercase;letter-spacing:.08em}
.tk{display:flex;align-items:center;gap:10px;font:500 12px/1 var(--font-mono);color:var(--color-label-alternative)}
.tk b{font:600 12px/1 var(--font-sans);color:var(--color-label-normal)}
.dot{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid var(--color-line-normal)}
</style></head><body>
<div class="cap">Semantic — Label (text) opacity scale</div>
<div class="tk"><span class="dot" style="background:rgba(23,23,25,1)"></span><b>label/normal</b><span>black</span></div>
<div class="tk"><span class="dot" style="background:rgba(46,47,51,.88)"></span><b>label/neutral</b><span>88%</span></div>
<div class="tk"><span class="dot" style="background:rgba(55,56,60,.61)"></span><b>label/alternative</b><span>61%</span></div>
<div class="tk"><span class="dot" style="background:rgba(55,56,60,.28)"></span><b>label/assistive</b><span>28%</span></div>
<div class="tk"><span class="dot" style="background:rgba(55,56,60,.16)"></span><b>label/disable</b><span>16%</span></div>
<div class="tk"><span class="dot" style="background:#0066FF"></span><b>primary/normal</b><span>#0066FF</span></div>
<div class="tk"><span class="dot" style="background:#FFFFFF"></span><b>bg/normal</b><span>#FFFFFF</span></div>
<div class="tk"><span class="dot" style="background:#F7F7F8"></span><b>bg/alternative</b><span>#F7F7F8</span></div>
<div class="tk"><span class="dot" style="background:rgba(112,115,124,.22)"></span><b>line/normal</b><span>22%</span></div>
<div class="tk"><span class="dot" style="background:rgba(112,115,124,.45)"></span><b>line/neutral</b><span>45%</span></div>
</body></html>
