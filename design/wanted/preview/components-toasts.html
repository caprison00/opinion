<!doctype html>
<!-- @dsCard group="Components" name="Toasts" subtitle="Success, warn, error, info" viewport="700x140" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;display:flex;align-items:flex-start;gap:18px}
.cap{position:absolute;top:8px;left:24px;font:600 11px/1 var(--font-sans);color:var(--color-label-alternative);text-transform:uppercase;letter-spacing:.08em}
.toast{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;font:500 13px var(--font-sans);box-shadow:0 10px 15px -3px rgba(23,23,23,.07),0 4px 6px -2px rgba(0,0,0,.07);min-width:220px}
.toast .ico{width:18px;height:18px;border-radius:9999px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
.success{background:#fff}.success .ico{background:var(--color-green-50)}
.warn{background:#fff}.warn .ico{background:var(--color-orange-50)}
.error{background:#fff}.error .ico{background:var(--color-red-50)}
.info{background:var(--color-coolNeutral-10);color:#fff}.info .ico{background:var(--color-blue-50)}
</style></head><body>
<span class="cap">Toasts / Snackbars</span>
<div class="toast success" style="margin-top:24px"><span class="ico">✓</span><span>지원이 완료되었습니다</span></div>
<div class="toast warn" style="margin-top:24px"><span class="ico">!</span><span>저장되지 않은 변경사항</span></div>
<div class="toast error" style="margin-top:24px"><span class="ico">×</span><span>네트워크 오류</span></div>
<div class="toast info" style="margin-top:24px"><span class="ico">i</span><span>New message from recruiter</span></div>
</body></html>
