<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Status & Accents" subtitle="Positive · Cautionary · Negative · Violet" viewport="700x280" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;display:flex;flex-direction:column;gap:12px}
.cap{font:600 11px/1 var(--font-sans);color:var(--color-label-alternative);text-transform:uppercase;letter-spacing:.08em}
.r{display:flex;align-items:center;gap:14px}
.label{font:500 12px var(--font-sans);color:var(--color-label-alternative);width:90px;flex:none}
.row{display:flex;gap:6px;flex:1}
.cell{flex:1;height:48px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font:500 10px/1.1 var(--font-mono)}
.dark{color:rgba(255,255,255,.85)}
.light{color:var(--color-label-alternative)}
</style></head><body>
<div class="cap">Status colors</div>
<div class="r"><span class="label">Positive</span><div class="row">
<div class="cell light" style="background:#D9FFE6">95</div>
<div class="cell dark" style="background:#00BF40">50</div>
<div class="cell dark" style="background:#009632">40</div>
<div class="cell dark" style="background:#006E25">25</div>
</div></div>
<div class="r"><span class="label">Cautionary</span><div class="row">
<div class="cell light" style="background:#FEF4E6">95</div>
<div class="cell dark" style="background:#FF9200">50</div>
<div class="cell dark" style="background:#D17600">40</div>
<div class="cell dark" style="background:#9C5800">30</div>
</div></div>
<div class="r"><span class="label">Negative</span><div class="row">
<div class="cell light" style="background:#FEECEC">94</div>
<div class="cell dark" style="background:#FF4242">50</div>
<div class="cell dark" style="background:#E52222">40</div>
<div class="cell dark" style="background:#B20C0C">25</div>
</div></div>
<div class="r"><span class="label">Violet</span><div class="row">
<div class="cell light" style="background:#F0ECFE">95</div>
<div class="cell dark" style="background:#6541F2">50</div>
<div class="cell dark" style="background:#4F29E5">40</div>
<div class="cell dark" style="background:#23098F">15</div>
</div></div>
</body></html>
